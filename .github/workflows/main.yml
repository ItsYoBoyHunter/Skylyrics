
name: Build SkyLyrics

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Extract mod
        run: unzip -o skylyrics-mod.zip -d source

      - name: Build mod
        working-directory: source/skylyrics
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: SkyLyrics-JAR
          path: source/skylyrics/build/libs/*.jar
